name: NetEase sync MVP

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/netease-sync.yml'
      - 'app/src/main/kotlin/com/metrolist/music/netease/**'
      - 'app/src/main/kotlin/com/metrolist/music/db/MusicDatabase.kt'
      - 'app/src/main/kotlin/com/metrolist/music/utils/SyncUtils.kt'
      - 'app/src/main/kotlin/com/metrolist/music/viewmodels/NeteaseViewModel.kt'
      - 'app/src/main/kotlin/com/metrolist/music/ui/screens/**'
      - 'app/src/main/res/values/metrolist_strings.xml'
      - 'app/src/test/kotlin/com/metrolist/music/netease/**'
      - 'app/schemas/**'

permissions:
  contents: read

concurrency:
  group: netease-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v5
      - name: Create disposable debug signing key
        run: >-
          keytool -genkeypair -noprompt -keystore "$RUNNER_TEMP/netease-debug.keystore"
          -storepass android -keypass android -alias androiddebugkey -keyalg RSA
          -keysize 2048 -validity 10000 -dname 'CN=Metrolist Debug,O=Development,C=US'
      - name: Build and verify native sync
        run: ./gradlew :app:assembleFossDebug :app:testFossDebugUnitTest --tests 'com.metrolist.music.netease.*' --console=plain
        env:
          METROLIST_DEBUG_KEYSTORE_PATH: ${{ runner.temp }}/netease-debug.keystore
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: netease-mvp-debug-and-tests
          path: |
            app/build/outputs/apk/foss/debug/*.apk
            app/build/reports/tests/testFossDebugUnitTest/
